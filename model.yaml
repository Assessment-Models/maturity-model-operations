id: maturity-model-operations
type: maturity-model
name: Operations Maturity Model
description: >-
  Operations Maturity Model — assesses enterprise operations: how day-to-day
  activities leverage key organizational capabilities to deliver outcomes.
  Covers value-stream and daily operations, capability orchestration, service
  and process management, workforce and ways of working, technology and
  infrastructure operations, and strategy alignment with the operating
  blueprint. Includes the Handshake & Touchpoint Model linking sibling
  assessment models in the ecosystem.
version: 2.1.1
conformance:
  contract:
    id: maturity-scale-contract
  source:
    organization: technehub-labs
    repository: dea-metamodel
  version: '1.0'
dependencies:
- id: dea-maturity-bands-v2
  reference: v1.0.0
components:
- id: operations-modernization
  type: dimension
  kind: import
  source:
    repository: Assessment-Models/maturity-components
  version: 1.0.0
  reference: v1.0.0
touchpoints:
  declaration: touchpoints.yaml
compatibility:
  metamodel:
    minimum: 1.0.0
    maximum: <2.0.0
  contracts:
  - id: maturity-scale-contract
    version: ^1.0
  - id: maturity-model-contract
    version: ^1.0
  - id: conformance-contract
    version: ^1.0
