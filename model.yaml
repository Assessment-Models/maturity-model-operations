id: maturity-model-operations
type: maturity-model
name: Operations Maturity Model
description: >-
  Operations Maturity Model — the parent operational assessment for enterprise
  operations: how the enterprise mobilizes capabilities, processes, services,
  people, resources, information, technology, governance and performance
  mechanisms to realize its intent and deliver value. Nine dimensions
  (D01..D09) assessed through two complementary perspectives on every
  criterion — Current Operational Realization and Future Operational
  Readiness — with the operational transformation gap as a first-class
  result. Includes the Handshake & Touchpoint Model linking sibling and
  specialized assessment models (autonomous operations, services delivery,
  technology, digital transformation, modernization) in the ecosystem.
version: 3.0.0
conformance:
  contract:
    id: maturity-scale-contract
  source:
    organization: technehub-labs
    repository: dea-metamodel
  version: '1.0'
dependencies:
- id: dea-maturity-bands-v2
  reference: v1.0.0
components:
- id: operations-modernization
  type: dimension
  kind: import
  source:
    repository: Assessment-Models/maturity-components
  version: 1.0.0
  reference: v1.0.0
touchpoints:
  declaration: touchpoints.yaml
compatibility:
  metamodel:
    minimum: 1.0.0
    maximum: <2.0.0
  contracts:
  - id: maturity-scale-contract
    version: ^1.0
  - id: maturity-model-contract
    version: ^1.0
  - id: conformance-contract
    version: ^1.0
