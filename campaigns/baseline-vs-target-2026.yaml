# =============================================================================
# campaigns/baseline-vs-target-2026.yaml — CR-OM-01 (restated for v3 on top of
# the CR-AM-17/19 scoring contract)
# Worked benchmark example. Illustrative only — not a real organisation.
# Demonstrates the campaign record under the v3 model: nine dimensions, the
# dual perspectives (current realization + future readiness), the
# transformation gap, canonical v2 band resolution and marginal-band EAV.
# =============================================================================
id: ops-campaign-example-2026
model: dea:maturity-operations@3.0.0
assessor: Operations Excellence Office (illustrative)
period: { baseline: 2026-11, target: 2027-11 }
baseline:
  dimension_scores: { D01: 58, D02: 52, D03: 60, D04: 66, D05: 62, D06: 50, D07: 63, D08: 55, D09: 57 }
  operations_index: 58.2
  resolved_band: level-3-systematic
  resolved_level: L-3
  effort_adjusted_value: 41.95
  readiness_index: 51.0
  transformation_gap: -7.2
target:
  dimension_scores: { D01: 68, D02: 62, D03: 70, D04: 72, D05: 70, D06: 60, D07: 70, D08: 65, D09: 67 }
  operations_index: 67.2
  resolved_band: level-3-systematic
  resolved_level: L-3
  effort_adjusted_value: 45.55
  readiness_index: 66.4
  transformation_gap: -0.8
deltas:
  dimensions: { D01: 10, D02: 10, D03: 10, D04: 6, D05: 8, D06: 10, D07: 7, D08: 10, D09: 10 }
  operations_index: 9.0
  effort_adjusted_value: 3.60
  readiness_index: 15.4
  transformation_gap: 6.4
  band_transition: none
notes: >-
  Index math (weights D01 .12 / D02 .12 / D03 .12 / D04 .11 / D05 .10 / D06
  .09 / D07 .12 / D08 .11 / D09 .11): baseline = .12(58)+.12(52)+.12(60)
  +.11(66)+.10(62)+.09(50)+.12(63)+.11(55)+.11(57) = 58.24 ~= 58.2;
  target = .12(68)+.12(62)+.12(70)+.11(72)+.10(70)+.09(60)+.12(70)+.11(65)
  +.11(67) = 67.24 ~= 67.2. Both resolve to L-3 Systematic under the
  canonical v2 bands. EAV is the marginal-band sum (CR-AM-19): baseline
  58.2 = 20/1.0 + 25/1.5 + 13.2/2.5 = 41.95; target 67.2 = 20/1.0 + 25/1.5
  + 22.2/2.5 = 45.55; EAV delta 3.60. EAV is supplementary and does not
  determine maturity-level resolution. The dual-perspective view is the
  point of the campaign: baseline readiness (51.0) trails current
  realization by 7.2 — the enterprise operates today better than it is
  prepared to operate tomorrow — and the target closes that transformation
  gap from -7.2 to -0.8 (+6.4) while raising the index by 9.0. Blueprint
  deductions bp-capability-anchoring, bp-continuity-resilience and
  bp-readiness-closure apply to the largest gaps (D02 52, D08 55, D06 50;
  readiness trail).
