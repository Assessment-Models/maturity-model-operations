# Level 2 — contract conformance (CR-AM-11 §14). Reuses
# Assessment-Models/assessment-ci's immutable reusable workflow to resolve
# the model handshake against the published contract suite.
#
# Both dependencies are pinned independently:
# - assessment-ci reusable workflow: immutable commit 1583f615...
# - dea-metamodel contract suite: immutable release tag v0.1.0-draft.
name: Contract conformance (Level 2)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-conformance:
    uses: Assessment-Models/assessment-ci/.github/workflows/contract-conformance.yml@1583f615b86a69c30f4537a351f35db1a17e1f96
    with:
      dea-metamodel-ref: v0.1.0-draft
      assessment-ci-ref: 9c0fb2596f5a2d3bd0b33787feed1ef5861c909a
      manifest-path: model.yaml
