# Level 1 — local model CI (CR-AM-11 §14). Validates the model manifest
# against the published manifest schema, the model-owned scale against the
# published maturity-scale schema, the model register, and the worked example's
# scoring math.
#
# Level 2 (contract conformance against a pinned dea-metamodel release) is a
# separate workflow that reuses Assessment-Models/assessment-ci's reusable
# workflow.
name: Local model CI (Level 1)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml jsonschema
      - name: Level 1 — local model validation
        run: python scripts/local_validate.py
