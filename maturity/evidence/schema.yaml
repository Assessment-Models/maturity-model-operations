# =============================================================================
# maturity/evidence/schema.yaml — RELEASE 2.1.0 (CR-AM-13)
# Evidence-item and assessment-record schemas for dea:maturity-operations v2.
# =============================================================================
id: dea:operations-evidence-schema-v1
repo_id: maturity-model-operations
model: dea:maturity-operations
version: 1.1.0
status: stable
confidence_levels:
  observed: 1.0
  evidenced: 0.85
  self-reported: 0.6
  unverified: 0.3
evidence_item:
  required: [criterion, artifact_ref, collected_at, collected_by, confidence]
  fields:
    criterion: { type: string, pattern: OPS-D[1-6]-SD[1-4]-C[0-9]+ }
    artifact_ref: { type: string, description: url | repo/path | document id }
    collected_at: { type: date }
    collected_by: { type: string, description: role name }
    confidence: { type: enum, values: [observed, evidenced, self-reported, unverified] }
    notes: { type: string, required: false }
assessment_record:
  required: [id, model, date, assessor, scores]
  fields:
    id: { type: string, pattern: ops-assessment-[a-z0-9-]+ }
    model: { type: string, example: dea:maturity-operations@2.1.0 }
    date: { type: date }
    assessor: { type: string }
    scores: { type: map, value_schema: criterion_score, description: criterion id -> criterion_score }
  criterion_score:
    required: [level_id, assessment_status, score, evidence_confidence]
    fields:
      level_id: { type: enum, values: [L-0, L-1, L-2, L-3, L-4, L-5] }
      assessment_status: { type: enum, values: [assessed, not-assessed] }
      score: { type: number, minimum: 0, maximum: 100 }
      evidence_confidence: { type: enum, values: [observed, evidenced, self-reported, unverified] }
      evidence: { type: array, items: evidence_item }
    rules:
      - L-0 requires assessment_status not-assessed, score 0 and evidence_confidence unverified.
      - L-1..L-5 require assessment_status assessed; legacy L0 is translated to L-1, never L-0.
    derived: { type: object, description: operations-index, resolved-level L-1..L-5, band, marginal-band EAV, per-dimension scores }
campaign_record:
  required: [baseline, target, deltas, benchmark]
  fields:
    baseline: { type: ref, description: assessment-record reference }
    target: { type: ref, description: assessment-record reference + target date }
    deltas: { type: object, description: per-dimension and criterion-level, baseline minus target }
    benchmark: { type: object, required: false, description: anonymized sector/cohort/period }
compatibility_rule: >-
  Assessment records carry the model version used. Criterion IDs are permanent
  keys; records remain benchmarkable across 1.x/2.x via migrations/v1-to-v2-map.yaml.
  Version 2.1.0 records use canonical scale identifiers and explicit assessment_status;
  legacy 2.0.0 identifiers are translated only through migrations/scale-v1-to-v2-map.yaml.
  An explicit L-0 score entry uses evidence_confidence unverified (0.3); no evidence item is fabricated.
